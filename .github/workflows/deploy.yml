# Deploys English Buddy automatically on every push to main:
#   1. tests the Worker
#   2. deploys the Cloudflare Worker and copies your secrets into it
#   3. publishes the app to GitHub Pages, already pointed at the Worker
# You can also run it by hand: Actions tab -> "Deploy English Buddy" -> "Run workflow".
name: Deploy English Buddy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-english-buddy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Test the Worker
        run: npm test
      - name: Test the learning question banks
        working-directory: web
        run: node --test test/banks.test.mjs

  worker:
    name: Deploy Worker (Cloudflare)
    needs: test
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      FAMILY_CODE: ${{ secrets.FAMILY_CODE }}
      AI_PROVIDER: ${{ vars.AI_PROVIDER || 'gemini' }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
      CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || 'claude-haiku-5-5' }}
      DAILY_LIMIT: ${{ vars.DAILY_LIMIT || '60' }}
      FAMILY_DAILY_LIMIT: ${{ vars.FAMILY_DAILY_LIMIT || '400' }}
      OWNER: ${{ github.repository_owner }}
      ALLOWED_ORIGIN_OVERRIDE: ${{ vars.ALLOWED_ORIGIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check required secrets
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$FAMILY_CODE" ] && missing="$missing FAMILY_CODE"
          if [ "$AI_PROVIDER" = "claude" ]; then
            [ -z "$ANTHROPIC_API_KEY" ] && missing="$missing ANTHROPIC_API_KEY"
          else
            [ -z "$GEMINI_API_KEY" ] && missing="$missing GEMINI_API_KEY"
          fi
          if [ -n "$missing" ]; then
            echo "::error title=Missing secrets::Add these in Settings -> Secrets and variables -> Actions:$missing (see README)."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci

      - name: Deploy Worker
        id: deploy
        run: |
          ORIGIN="${ALLOWED_ORIGIN_OVERRIDE:-https://${OWNER,,}.github.io}"
          echo "Allowing requests from $ORIGIN, AI provider: $AI_PROVIDER"
          status=0
          npx wrangler deploy \
            --var "AI_PROVIDER:$AI_PROVIDER" \
            --var "GEMINI_MODEL:$GEMINI_MODEL" \
            --var "CLAUDE_MODEL:$CLAUDE_MODEL" \
            --var "DAILY_LIMIT:$DAILY_LIMIT" \
            --var "FAMILY_DAILY_LIMIT:$FAMILY_DAILY_LIMIT" \
            --var "ALLOWED_ORIGIN:$ORIGIN" 2>&1 | tee deploy.log || status=$?
          if [ "$status" -ne 0 ]; then
            if grep -qi "workers.dev subdomain" deploy.log; then
              echo "::error title=Cloudflare setup::Open dash.cloudflare.com -> Workers & Pages once to create your free workers.dev subdomain, then re-run this workflow."
            fi
            if grep -qi "more than one account" deploy.log; then
              echo "::error title=Cloudflare account::Your token can see several accounts. Add the repo secret CLOUDFLARE_ACCOUNT_ID (see README)."
            fi
            exit "$status"
          fi
          URL=$(grep -oE 'https://[a-zA-Z0-9._-]+\.workers\.dev' deploy.log | head -n1)
          if [ -z "$URL" ]; then
            # Wrangler sometimes exits successfully without publishing anything.
            if grep -qi "workers.dev subdomain" deploy.log; then
              echo "::error title=Cloudflare setup needed::Your Cloudflare account has no workers.dev address yet. Open dash.cloudflare.com -> Workers & Pages (or the onboarding link in the log above), choose a subdomain name, then re-run this workflow."
            else
              echo "::error title=Worker not published::Cloudflare did not return a workers.dev address. See the log above."
            fi
            exit 1
          fi
          echo "Worker URL: $URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Copy secrets into the Worker
        run: |
          node -e '
            const s = { FAMILY_CODE: process.env.FAMILY_CODE };
            if (process.env.GEMINI_API_KEY) s.GEMINI_API_KEY = process.env.GEMINI_API_KEY;
            if (process.env.ANTHROPIC_API_KEY) s.ANTHROPIC_API_KEY = process.env.ANTHROPIC_API_KEY;
            require("fs").writeFileSync("secrets.json", JSON.stringify(s), { mode: 0o600 });
          '
          npx wrangler secret bulk secrets.json
          rm -f secrets.json

      - name: Check the Worker is answering
        if: steps.deploy.outputs.url != ''
        run: |
          sleep 5
          curl -fsS "${{ steps.deploy.outputs.url }}/health" || echo "::warning::Worker health check failed (it may need a minute to start)."

  pages:
    name: Publish app (GitHub Pages)
    needs: worker
    # Still publish the app if only the Worker step failed, so the page is reachable.
    if: ${{ !cancelled() && needs.worker.result != 'skipped' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Build site
        env:
          WORKER_URL: ${{ vars.WORKER_URL || needs.worker.outputs.url }}
        run: |
          rm -rf _site && cp -r web _site
          if [ -z "$WORKER_URL" ]; then
            echo "::warning title=Worker URL unknown::The app was published without a Worker URL. Fix the Worker deploy, or set the repo variable WORKER_URL."
          fi
          cat > _site/config.js <<EOF
          // Generated by GitHub Actions on deploy.
          window.BUDDY_CONFIG = { workerUrl: "${WORKER_URL}" };
          EOF
          sed -i "s/const BUILD_ID = 'dev';/const BUILD_ID = '${GITHUB_SHA::8}';/" _site/sw.js
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show the app link
        run: |
          echo "### 🎉 English Buddy is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Open this link on your phone: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
